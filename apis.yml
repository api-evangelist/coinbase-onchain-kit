apis:
  - aid: coinbase-onchain-kit:onchainkit-sdk
    name: OnchainKit React SDK
    description: >-
      Core @coinbase/onchainkit npm package providing React components and TypeScript
      utilities for onchain apps. Includes Wallet, Identity, Transaction, Swap, Checkout,
      Fund, NFT, Token, and Earn component families along with hooks and providers wired
      to Wagmi and Viem.
    humanURL: https://docs.base.org/onchainkit
    baseURL: https://www.npmjs.com/package/@coinbase/onchainkit
    tags:
      - SDK
      - React
      - TypeScript
      - Components
    properties:
      - type: Documentation
        url: https://docs.base.org/onchainkit
      - type: Repository
        url: https://github.com/coinbase/onchainkit
      - type: Package
        url: https://www.npmjs.com/package/@coinbase/onchainkit
  - aid: coinbase-onchain-kit:create-onchain-cli
    name: create-onchain CLI
    description: >-
      Bootstrap CLI (`npm create onchain`) that scaffolds a new OnchainKit application
      pre-wired with Wagmi, Viem, TailwindCSS, and Base. Generates starter projects for
      web apps and Mini Apps.
    humanURL: https://docs.base.org/onchainkit/getting-started
    baseURL: https://www.npmjs.com/package/create-onchain
    tags:
      - CLI
      - Scaffolding
      - Bootstrap
    properties:
      - type: Documentation
        url: https://docs.base.org/onchainkit/getting-started
      - type: Repository
        url: https://github.com/coinbase/onchainkit
  - aid: coinbase-onchain-kit:miniapp-manifest
    name: OnchainKit MiniApp Manifest Generator
    description: >-
      Utility that generates the Mini App manifest required to publish a Frames-based
      Mini App to Farcaster and other Mini App hosts. Validates manifest fields and
      handles signing.
    humanURL: https://docs.base.org/mini-apps
    baseURL: https://github.com/coinbase/onchainkit
    tags:
      - Mini Apps
      - Manifest
      - Frames
    properties:
      - type: Documentation
        url: https://docs.base.org/mini-apps
      - type: Repository
        url: https://github.com/coinbase/onchainkit
  - aid: coinbase-onchain-kit:smart-wallet
    name: Coinbase Smart Wallet Integration
    description: >-
      OnchainKit components and connectors that expose Coinbase Smart Wallet — an
      ERC-4337 smart contract wallet — for sign-in, paymaster-sponsored transactions,
      passkeys, and session keys.
    humanURL: https://docs.base.org/base-account
    baseURL: https://www.smartwallet.dev
    tags:
      - Smart Wallet
      - Account Abstraction
      - ERC-4337
      - Passkeys
    properties:
