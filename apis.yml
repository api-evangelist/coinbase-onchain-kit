aid: coinbase-onchain-kit
url: https://raw.githubusercontent.com/api-evangelist/coinbase-onchain-kit/refs/heads/main/apis.yml
name: Coinbase OnchainKit
kind: company
description: >-
  Coinbase OnchainKit is a TypeScript React framework from Coinbase for building onchain
  applications on Base and other EVM networks. It bundles ready-made React components
  (wallets, identity, transactions, swap, checkout, fund, NFT), TypeScript utilities,
  and integrations with Smart Wallet, Base Account, Frames, and Mini Apps. OnchainKit
  is distributed as the @coinbase/onchainkit npm package along with companion CLIs
  (create-onchain) and a MiniApp manifest generator. It is built on top of Wagmi,
  Viem, and TailwindCSS and is the recommended client SDK for the Base ecosystem.
image: https://kinlane-productions.s3.amazonaws.com/apis-json/apis-json-logo.jpg
tags:
  - Onchain
  - Web3
  - React
  - SDK
  - Base
  - Smart Wallet
  - Frames
  - Mini Apps
created: '2026-05-23'
modified: '2026-05-23'
